<!DOCTYPE html>
<html lang="es">
<head>

</head>
<body>
    <header class="header"><h1>Mercado Viva</h1></header>
    <main class="contenedor">

        <table id="tabla-pqrs">

            <tbody id="cuerpo-tabla"></tbody>
        </table>
    </main>
    <script src="/static/js/gestion_pqrs.js"></script>
