<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mercado Viva - Iniciar sesión</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="pagina-login">
    <div class="login-marca">
        <h1>Mercado Viva</h1>
    </div>

    <div class="login-card">
        <h2>Bienvenido de nuevo</h2>
        <p class="subtitulo">Ingresa tus credenciales para continuar.</p>

        <form id="form-login">
            <div>
                <label for="email">Correo electrónico</label>
                <div class="campo-con-icono">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z" stroke="none"/><path d="M4 4h16v16H4V4z"/><path d="M22 6l-10 7L2 6"/></svg>
                    <input type="email" id="email" placeholder="tu@correo.com" required>
                </div>
            </div>

            <div>
                <label for="password">Contraseña</label>
                <div class="campo-con-icono">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" onclick="alternarPassword()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="boton-con-flecha">
                Iniciar sesión
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </form>
        <p id="mensaje-error" class="mensaje-error"></p>
    </div>

    <p class="login-pie">¿No tienes cuenta? <a href="/registro">Regístrate aquí</a></p>

    <script src="/static/js/login.js"></script>
    <script>
        function alternarPassword() {
            const campo = document.getElementById("password");
            campo.type = campo.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
