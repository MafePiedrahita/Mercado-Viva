<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mercado Viva - Registro</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="pagina-login">
    <header class="header"><h1>Mercado Viva</h1></header>

    <div class="contenedor pagina-centrada">
        <div class="login-card">
            <h2>Crear cuenta</h2>
            <p class="subtitulo">Regístrate para empezar a usar el sistema.</p>

            <form id="form-registro">
                <div>
                    <label for="nombre">Nombre completo</label>
                    <div class="campo-con-icono">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                        <input type="text" id="nombre" placeholder="Tu nombre" required>
                    </div>
                </div>

                <div>
                    <label for="email">Correo electrónico</label>
                    <div class="campo-con-icono">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z" stroke="none"/><path d="M4 4h16v16H4V4z"/><path d="M22 6l-10 7L2 6"/></svg>
                        <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <div>
                    <label for="password">Contraseña</label>
                    <div class="campo-con-icono">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="alternarPassword()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="rol">Rol</label>
                    <select id="rol" required>
                        <option value="cliente">Cliente</option>
                        <option value="servicio_cliente">Servicio al cliente</option>
                        <option value="area_responsable">Área responsable</option>
                    </select>
                </div>

                <button type="submit" class="boton-con-flecha">
                    Registrarme
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>
            <p id="mensaje-error" class="mensaje-error"></p>
            <p id="mensaje-exito" class="mensaje-exito"></p>
        </div>

        <p class="login-pie">¿Ya tienes cuenta? <a href="/">Inicia sesión</a></p>
    </div>

    <script src="/static/js/registro.js"></script>
    <script>
        function alternarPassword() {
            const campo = document.getElementById("password");
            campo.type = campo.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
