<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Responder PQR</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body>
    <header class="header">
        <h1>Mercado Viva</h1>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
    </header>
    <main class="contenedor">
        <h2>PQR asignadas (<span id="nombre-area">Área responsable</span>)</h2>
        <table id="tabla-pqrs">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Motivo</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Respuesta</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla"></tbody>
        </table>
    </main>
    <script src="/static/js/comun.js"></script>
    <script src="/static/js/responder_pqr.js"></script>
</body>
</html>
