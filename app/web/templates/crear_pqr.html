<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar PQR</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body>
    <header class="header"><h1>Mercado Viva</h1></header>
    <main class="contenedor">
        <h2>Registrar una PQR</h2>
        <form id="form-pqr">
            <input type="text" id="motivo" placeholder="Motivo" required>
            <textarea id="descripcion" placeholder="Descripción" required></textarea>
            <button type="submit">Registrar</button>
        </form>
        <p id="mensaje"></p>
        <p><a href="/historial">Ver mi historial</a></p>
    </main>
    <script src="/static/js/crear_pqr.js"></script>
</body>
</html>
